version: '3'

vars:
  BINARY_NAME: playwright-mcp-server
  BUILD_DIR: bin
  DOCKER_IMAGE: playwright-mcp
  MCP_PORT: '3000'
  MCP_CONFIG_PATH: ''
  MCP_ENABLED_TOOLS: 'navigate_and_extract_text,session_create,session_close,navigate,extract_text'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install all dependencies including Playwright browsers
    cmds:
      - task: deps
      - task: playwright:install

  deps:
    desc: Download Go module dependencies
    cmds:
      - go mod download
      - go mod tidy

  playwright:install:
    desc: Install Playwright browsers and dependencies
    cmds:
      - go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps

  playwright:install-chromium:
    desc: Install only Chromium browser
    cmds:
      - go run github.com/mxschmitt/playwright-go/cmd/playwright install chromium

  build:
    desc: Build the server binary
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}}{{exeExt}} ./cmd/server
    sources:
      - '**/*.go'
    generates:
      - '{{.BUILD_DIR}}/{{.BINARY_NAME}}{{exeExt}}'

  run:
    desc: Run the server
    deps: [build]
    cmds:
      - '{{.BUILD_DIR}}/{{.BINARY_NAME}}{{exeExt}}'

  test:
    desc: Run unit tests
    cmds:
      - go clean -testcache
      - go test -v ./...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go clean -testcache
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test:integration:
    desc: Run integration tests (requires Playwright installed)
    cmds:
      - go clean -testcache
      - go test -v -tags=integration ./...

  test:e2e:
    desc: Run E2E tests (requires Playwright installed and builds server)
    deps: [build]
    cmds:
      - go clean -testcache
      - go test -v -tags=e2e ./e2e/...

  lint:
    desc: Run linting and static analysis
    cmds:
      - go vet ./...
      - go fmt ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out coverage.html

  docker:build:
    desc: Build the Docker image
    deps: [build]
    cmds:
      - docker build -t {{.DOCKER_IMAGE}} .

  docker:run:
    desc: Run the Docker container (override port with `task docker:run MCP_PORT=8080`)
    deps: [docker:build]
    cmds:
      - docker rm -f {{.DOCKER_IMAGE}} 2>/dev/null || true
      - >-
        docker run --rm -d -p {{.MCP_PORT}}:{{.MCP_PORT}} --name {{.DOCKER_IMAGE}}
        -e MCP_PORT={{.MCP_PORT}}
        {{if .MCP_CONFIG_PATH}}-v {{.MCP_CONFIG_PATH}}:/app/custom-config.yaml -e MCP_CONFIG_PATH=/app/custom-config.yaml{{end}}
        {{.DOCKER_IMAGE}}

  docker:run:min-tools:
    desc: Run the Docker container with a minimal tool set (override with `task docker:run:min-tools MCP_ENABLED_TOOLS=...`)
    deps: [docker:build]
    cmds:
      - docker rm -f {{.DOCKER_IMAGE}} 2>/dev/null || true
      - >-
        docker run --rm -d -p {{.MCP_PORT}}:{{.MCP_PORT}} --name {{.DOCKER_IMAGE}}
        -e MCP_PORT={{.MCP_PORT}}
        -e MCP_ENABLED_TOOLS={{.MCP_ENABLED_TOOLS}}
        {{if .MCP_CONFIG_PATH}}-v {{.MCP_CONFIG_PATH}}:/app/custom-config.yaml -e MCP_CONFIG_PATH=/app/custom-config.yaml{{end}}
        {{.DOCKER_IMAGE}}

  check:
    desc: Run all checks (lint, vet, test, build)
    cmds:
      - task: lint
      - task: test
      - task: build
